name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Runs on every PR head and again on push to main, so the default branch
# always carries its own correctness result (the `quality` check).
concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR pushes are cancelled; every main commit keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPYCACHEPREFIX: /tmp/pycache
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # Test runner + libraries the suite imports at collection time.
          # numpy/pandas/scikit-learn back the data-science modules and their tests;
          # kaggle backs kaggle_auth_doctor / leaderboard_tracker test modules.
          python -m pip install pytest pytest-cov pytest-mock requests pyyaml numpy pandas scikit-learn "kaggle<2" ruff

      - name: Verify (same entrypoint as `make verify`)
        run: bash scripts/verify.sh
