name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPYCACHEPREFIX: /tmp/pycache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Security guardrails
        run: |
          set -euo pipefail

          if git ls-files --error-unmatch kaggle.json >/dev/null 2>&1; then
            echo "::error file=kaggle.json::Remove committed Kaggle credentials."
            exit 1
          fi

          if rg -n --glob '*.py' --glob '*.sh' --glob '!tests/**' --glob '!.venv/**' '/Users/' .; then
            echo "::error::Hardcoded /Users paths found in scripts."
            exit 1
          fi

          if rg -n --glob '*.py' --glob '*.sh' --glob '!tests/**' --glob '!.venv/**' 'trust_remote_code\\s*=\\s*True' .; then
            echo "::error::Avoid trust_remote_code=True unless explicitly reviewed."
            exit 1
          fi

      - name: Script syntax checks
        run: |
          set -euo pipefail
          bash -n manage.sh
          PYTHONPYCACHEPREFIX=/tmp/pycache python -m py_compile $(find . -maxdepth 4 -type f -name '*.py' | sort)

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov pytest-mock requests

      - name: Prepare preflight fixtures
        run: |
          set -euo pipefail
          printf 'title,totalVotes\nA,10\nB,3\n' >/tmp/kernels.csv
          printf 'title,voteCount\nD1,2\nD2,7\n' >/tmp/datasets.csv
          printf 'competition,userHasEntered\nC1,true\nC2,false\nC3,1\n' >/tmp/competitions.csv

      - name: Repository preflight
        run: |
          set -euo pipefail
          bash manage.sh preflight \
            --no-pytest \
            --today 2026-03-07 \
            --strict-doctor \
            --kernels-csv /tmp/kernels.csv \
            --datasets-csv /tmp/datasets.csv \
            --competitions-csv /tmp/competitions.csv

      - name: Unit tests with coverage
        run: |
          pytest -q --cov=. --cov-report=term-missing:skip-covered --cov-config=.coveragerc

      - name: Script smoke tests
        run: |
          set -euo pipefail
          PYTHONPYCACHEPREFIX=/tmp/pycache python datasets/ai-research-trends/create_dataset.py >/tmp/ai-research.log
          PYTHONPYCACHEPREFIX=/tmp/pycache python datasets/programming-benchmarks/create_dataset.py >/tmp/programming-benchmarks.log
          PYTHONPYCACHEPREFIX=/tmp/pycache python ensemble-stacking/build_notebook.py >/tmp/ensemble.log
          PYTHONPYCACHEPREFIX=/tmp/pycache python llm-finetuning/build_notebook.py >/tmp/llm.log
          PYTHONPYCACHEPREFIX=/tmp/pycache python timeseries-transformers/_build_notebook.py >/tmp/timeseries.log
          PYTHONPYCACHEPREFIX=/tmp/pycache python medal_ops.py --output-root /tmp/medal_ops_ci --today 2026-02-22 scorecard >/tmp/scorecard.log
          PYTHONPYCACHEPREFIX=/tmp/pycache python medal_ops.py --output-root /tmp/medal_ops_ci --today 2026-02-22 weekly-plan >/tmp/weekly-plan.log
          PYTHONPYCACHEPREFIX=/tmp/pycache python medal_ops.py --output-root /tmp/medal_ops_ci --today 2026-02-22 pace >/tmp/pace.log
          PYTHONPYCACHEPREFIX=/tmp/pycache python medal_ops.py --output-root /tmp/medal_ops_ci --today 2026-02-22 sync-template --out-dir /tmp/medal_ops_sync_inputs >/tmp/sync-template.log
          PYTHONPYCACHEPREFIX=/tmp/pycache python stale_content_detector.py --today 2026-02-22 >/tmp/stale-content.log
          PYTHONPYCACHEPREFIX=/tmp/pycache python dataset_explore_generator.py --dir datasets/credit-card-fraud >/tmp/explore-gen.log
          PYTHONPYCACHEPREFIX=/tmp/pycache python competition_entry.py --help >/tmp/comp-entry.log
          PYTHONPYCACHEPREFIX=/tmp/pycache python metadata_tracker.py --help >/tmp/metadata-tracker.log
          PYTHONPYCACHEPREFIX=/tmp/pycache python medal_ops.py --output-root /tmp/medal_ops_ci --today 2026-02-22 sync --dry-run --kernels-csv /tmp/kernels.csv --datasets-csv /tmp/datasets.csv --competitions-csv /tmp/competitions.csv >/tmp/sync.log
