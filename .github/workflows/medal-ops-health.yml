name: Medal Ops Health

on:
  push:
    branches:
      - main
      - push-sync
  schedule:
    # Weekly (Sat 09:10 UTC) — free-plan private-repo minutes are capped.
    - cron: "10 9 * * 6"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - live
          - offline-fixture
      max_stale_days:
        description: "doctor stale threshold"
        required: true
        default: "30"
        type: string
      min_dataset_usability_score:
        description: "minimum dataset usability score"
        required: true
        default: "85"
        type: string
      live_alert_under:
        description: "critical live usability threshold"
        required: true
        default: "0.8"
        type: string
      live_target_rating:
        description: "target live usability threshold"
        required: true
        default: "1.0"
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: medal-ops-health
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI (live mode only)
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          # A KAGGLE_API_TOKEN (the kind kaggle.com/settings/api now issues)
          # or the legacy KAGGLE_USERNAME + KAGGLE_KEY pair; the CLI tries the
          # token first.
          if [[ -z "${KAGGLE_API_TOKEN:-}" && ( -z "${KAGGLE_USERNAME:-}" || -z "${KAGGLE_KEY:-}" ) ]]; then
            echo "Skipping Kaggle CLI install (credentials not configured)."
            exit 0
          fi
          python -m pip install --upgrade pip
          python -m pip install "kaggle<2"

      - name: Configure Kaggle credentials (live mode only)
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${KAGGLE_USERNAME:-}" || -z "${KAGGLE_KEY:-}" ]]; then
            echo "Skipping kaggle.json setup (no legacy key; KAGGLE_API_TOKEN, if set, is read from the environment)."
            exit 0
          fi
          mkdir -p ~/.kaggle
          cat > ~/.kaggle/kaggle.json <<EOF
          {"username":"${KAGGLE_USERNAME}","key":"${KAGGLE_KEY}"}
          EOF
          chmod 600 ~/.kaggle/kaggle.json

      - name: Build datasets
        run: |
          set -euo pipefail
          python -m pip install numpy pandas
          bash manage.sh build-datasets

      # A configured-but-rejected key used to turn every scheduled run red for
      # weeks (see #106). In auto mode a rejected key now downgrades the run to
      # the offline fixture checks with a visible warning; an explicit `live`
      # dispatch still fails hard.
      - name: Probe Kaggle credentials
        id: auth
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -uo pipefail
          if [[ -z "${KAGGLE_API_TOKEN:-}" && ( -z "${KAGGLE_USERNAME:-}" || -z "${KAGGLE_KEY:-}" ) ]]; then
            echo "accepted=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          python -m kaggle_portfolio.ops.kaggle_auth_doctor >/tmp/auth.log 2>&1
          rc=$?
          cat /tmp/auth.log
          # 3 = Kaggle answered and refused the key (kaggle_auth_doctor.REJECTED_EXIT).
          # Any other failure (owner mismatch, network) is not a key problem, so
          # the live checks still run and surface it.
          if [[ "${rc}" == "3" ]]; then
            echo "accepted=false" >> "${GITHUB_OUTPUT}"
            echo "::warning title=Kaggle credentials rejected::Kaggle refused the configured key. Running offline checks only. Rotate the KAGGLE_API_TOKEN secret (kaggle.com/settings -> API -> Create New Token)."
          else
            echo "accepted=true" >> "${GITHUB_OUTPUT}"
            [[ "${rc}" == "0" ]] || echo "::warning title=Kaggle auth doctor failed::Not a rejected key (exit ${rc}); running live checks. See the auth log above."
          fi

      - name: Run medal ops health checks
        id: checks
        continue-on-error: true
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          FORCE_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || 'auto' }}
          MAX_STALE_DAYS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.max_stale_days || '30' }}
          MIN_DATASET_USABILITY_SCORE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.min_dataset_usability_score || '85' }}
          LIVE_ALERT_UNDER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.live_alert_under || '0.8' }}
          LIVE_TARGET_RATING: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.live_target_rating || '1.0' }}
          AUTH_ACCEPTED: ${{ steps.auth.outputs.accepted }}
        run: |
          set -euo pipefail
          MODE="${FORCE_MODE}"
          if [[ "${MODE}" == "auto" ]]; then
            MODE="offline-fixture"
            if [[ "${AUTH_ACCEPTED}" == "true" ]]; then
              MODE="live"
            fi
          fi

          if [[ "${MODE}" != "live" && "${MODE}" != "offline-fixture" ]]; then
            echo "Invalid mode: ${MODE}" >&2
            exit 1
          fi

          if ! [[ "${MAX_STALE_DAYS}" =~ ^[0-9]+$ ]]; then
            echo "MAX_STALE_DAYS must be an integer: ${MAX_STALE_DAYS}" >&2
            exit 1
          fi

          if ! [[ "${MIN_DATASET_USABILITY_SCORE}" =~ ^[0-9]+$ ]]; then
            echo "MIN_DATASET_USABILITY_SCORE must be an integer: ${MIN_DATASET_USABILITY_SCORE}" >&2
            exit 1
          fi

          python - <<PY
          import sys
          alert = float("${LIVE_ALERT_UNDER}")
          target = float("${LIVE_TARGET_RATING}")
          if not (0.0 <= alert <= 1.0):
              raise SystemExit("LIVE_ALERT_UNDER must be between 0.0 and 1.0")
          if not (0.0 <= target <= 1.0):
              raise SystemExit("LIVE_TARGET_RATING must be between 0.0 and 1.0")
          if alert > target:
              raise SystemExit("LIVE_ALERT_UNDER cannot be greater than LIVE_TARGET_RATING")
          PY

          if (( MIN_DATASET_USABILITY_SCORE < 0 || MIN_DATASET_USABILITY_SCORE > 100 )); then
            echo "MIN_DATASET_USABILITY_SCORE must be between 0 and 100." >&2
            exit 1
          fi

          if [[ "${MODE}" == "live" && -z "${KAGGLE_API_TOKEN:-}" && ( -z "${KAGGLE_USERNAME:-}" || -z "${KAGGLE_KEY:-}" ) ]]; then
            echo "Live mode requested but neither KAGGLE_API_TOKEN nor KAGGLE_USERNAME/KAGGLE_KEY secrets are configured." >&2
            exit 1
          fi
          # The live usability tracker needs the owner name whichever
          # credential is used.
          if [[ "${MODE}" == "live" && -z "${KAGGLE_USERNAME:-}" ]]; then
            echo "Live mode requires the KAGGLE_USERNAME secret (the dataset owner)." >&2
            exit 1
          fi

          echo "mode=${MODE}" >> "${GITHUB_OUTPUT}"

          if [[ "${MODE}" == "live" ]]; then
            PYTHONPYCACHEPREFIX=/tmp/pycache python -m kaggle_portfolio.ops.medal_ops doctor --output-root /tmp/medal_ops_health --strict --require-kaggle --max-stale-days "${MAX_STALE_DAYS}" >/tmp/doctor.log
            PYTHONPYCACHEPREFIX=/tmp/pycache python -m kaggle_portfolio.datasets.dataset_usability --output-root /tmp/medal_ops_health --strict --fail-under "${MIN_DATASET_USABILITY_SCORE}" >/tmp/dataset-usability.log
            PYTHONPYCACHEPREFIX=/tmp/pycache python -m kaggle_portfolio.datasets.dataset_usability --output-root /tmp/medal_ops_health --live --owner "${KAGGLE_USERNAME}" --daily-tracker --alert-under "${LIVE_ALERT_UNDER}" --target-rating "${LIVE_TARGET_RATING}" --fail-on-live-alert >/tmp/dataset-usability-tracker.log
            PYTHONPYCACHEPREFIX=/tmp/pycache python -m kaggle_portfolio.ops.medal_ops sync --output-root /tmp/medal_ops_health --dry-run >/tmp/sync.log
          else
            # Offline: no live Kaggle data, so sync is skipped; doctor still
            # checks the tracker (parse + staleness) and the environment.
            printf 'ref,title,size,lastUpdated,downloadCount,voteCount,usabilityRating\nsample/a,A,1,2026-02-24,0,0,0.82\nsample/b,B,1,2026-02-24,0,0,0.74\n' >/tmp/live-ratings.csv
            PYTHONPYCACHEPREFIX=/tmp/pycache python -m kaggle_portfolio.ops.medal_ops doctor --output-root /tmp/medal_ops_health --strict --max-stale-days "${MAX_STALE_DAYS}" >/tmp/doctor.log
            PYTHONPYCACHEPREFIX=/tmp/pycache python -m kaggle_portfolio.datasets.dataset_usability --output-root /tmp/medal_ops_health --strict --fail-under "${MIN_DATASET_USABILITY_SCORE}" >/tmp/dataset-usability.log
            PYTHONPYCACHEPREFIX=/tmp/pycache python -m kaggle_portfolio.datasets.dataset_usability --output-root /tmp/medal_ops_health --daily-tracker --live-ratings-csv /tmp/live-ratings.csv --alert-under "${LIVE_ALERT_UNDER}" --target-rating "${LIVE_TARGET_RATING}" >/tmp/dataset-usability-tracker.log
          fi

      - name: Upload health logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: medal-ops-health-logs
          path: |
            /tmp/doctor.log
            /tmp/dataset-usability.log
            /tmp/dataset-usability-tracker.log
            /tmp/auth.log
            /tmp/sync.log
          if-no-files-found: ignore

      - name: Open or update incident issue
        if: ${{ steps.checks.outcome == 'failure' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHECK_MODE: ${{ steps.checks.outputs.mode }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "Medal Ops Daily Health Check Failed";
            const marker = "<!-- medal-ops-daily-health -->";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const mode = process.env.CHECK_MODE || "unknown";
            const now = new Date().toISOString();

            const body = [
              marker,
              "Automated medal ops daily health check failed.",
              "",
              `- Timestamp: ${now}`,
              `- Workflow run: ${runUrl}`,
              `- Mode: ${mode}`,
              `- Commit: ${context.sha}`,
              "",
              "The `medal-ops-health-logs` artifact contains `doctor.log`, `dataset-usability.log`, `dataset-usability-tracker.log`, `sync.log`, and `auth.log`."
            ].join("\n");

            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100
            });

            const existing = issues.find(
              (issue) => issue.title === title && typeof issue.body === "string" && issue.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body
              });
            }

      - name: Close incident issue on recovery
        if: ${{ steps.checks.outcome == 'success' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "Medal Ops Daily Health Check Failed";
            const marker = "<!-- medal-ops-daily-health -->";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100
            });

            for (const issue of issues) {
              if (issue.title !== title) continue;
              if (typeof issue.body !== "string" || !issue.body.includes(marker)) continue;

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `Automated recovery detected. Checks are passing again: ${runUrl}`
              });

              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: "closed"
              });
            }

      - name: Mark job failed when checks fail
        if: ${{ steps.checks.outcome == 'failure' }}
        run: exit 1
