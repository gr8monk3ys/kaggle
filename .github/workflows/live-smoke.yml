name: Live Smoke

on:
  workflow_dispatch:
    inputs:
      owner:
        description: "Expected Kaggle owner slug"
        required: true
        default: "lorenzoscaturchio"
        type: string
      limit:
        description: "Max items to inspect per dry-run step"
        required: true
        default: "1"
        type: string
      include_live_datasets:
        description: "Inspect live datasets as well as drafts"
        required: true
        default: false
        type: boolean
      discussion_mode:
        description: "Discussion smoke scope"
        required: true
        default: "queue-only"
        type: choice
        options:
          - queue-only
          - login
          - skip

permissions:
  contents: read

concurrency:
  group: kaggle-live-smoke
  cancel-in-progress: false

jobs:
  smoke-live:
    runs-on: ubuntu-latest
    env:
      PYTHONPYCACHEPREFIX: /tmp/pycache
      REPORT_JSON: /tmp/kaggle-live-smoke-dataset-publish.json
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install base dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests kaggle

      - name: Configure Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${KAGGLE_USERNAME:-}" || -z "${KAGGLE_KEY:-}" ]]; then
            echo "KAGGLE_USERNAME and KAGGLE_KEY secrets are required for live smoke checks." >&2
            exit 1
          fi
          mkdir -p ~/.kaggle
          cat > ~/.kaggle/kaggle.json <<EOF
          {"username":"${KAGGLE_USERNAME}","key":"${KAGGLE_KEY}"}
          EOF
          chmod 600 ~/.kaggle/kaggle.json

      - name: Install discussion login dependencies
        if: ${{ github.event.inputs.discussion_mode == 'login' }}
        run: |
          python -m pip install -r pi-automation/scripts/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run live smoke checks
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_EMAIL: ${{ secrets.KAGGLE_EMAIL }}
          KAGGLE_PASSWORD: ${{ secrets.KAGGLE_PASSWORD }}
        run: |
          set -euo pipefail
          discussion_mode="${{ github.event.inputs.discussion_mode }}"
          if [[ "${discussion_mode}" == "login" && ( -z "${KAGGLE_EMAIL:-}" || -z "${KAGGLE_PASSWORD:-}" ) ]]; then
            echo "KAGGLE_EMAIL and KAGGLE_PASSWORD secrets are required for discussion login smoke." >&2
            exit 1
          fi

          args=(
            smoke-live
            --owner "${{ github.event.inputs.owner }}"
            --limit "${{ github.event.inputs.limit }}"
            --report-json "${REPORT_JSON}"
          )

          if [[ "${{ github.event.inputs.include_live_datasets }}" == "true" ]]; then
            args+=(--include-live-datasets)
          fi

          case "${discussion_mode}" in
            skip)
              args+=(--no-discussion)
              ;;
            queue-only)
              ;;
            login)
              args+=(--check-discussion-login)
              ;;
            *)
              echo "Unsupported discussion_mode: ${discussion_mode}" >&2
              exit 1
              ;;
          esac

          bash manage.sh "${args[@]}"

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: live-smoke-artifacts
          path: |
            /tmp/kaggle-live-smoke-dataset-publish.json
          if-no-files-found: ignore
