name: Live Smoke

on:
  workflow_dispatch:
    inputs:
      owner:
        description: "Expected Kaggle owner slug"
        required: true
        default: "lorenzoscaturchio"
        type: string
      limit:
        description: "Max items to inspect per dry-run step"
        required: true
        default: "1"
        type: string
      include_live_datasets:
        description: "Inspect live datasets as well as drafts"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: kaggle-live-smoke
  cancel-in-progress: false

jobs:
  smoke-live:
    runs-on: ubuntu-latest
    env:
      PYTHONPYCACHEPREFIX: /tmp/pycache
      REPORT_JSON: /tmp/kaggle-live-smoke-dataset-publish.json
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install base dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests "kaggle<2"

      - name: Configure Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${KAGGLE_API_TOKEN:-}" && ( -z "${KAGGLE_USERNAME:-}" || -z "${KAGGLE_KEY:-}" ) ]]; then
            echo "No legacy key; KAGGLE_API_TOKEN is read from the environment."
            exit 0
          fi
          if [[ -z "${KAGGLE_USERNAME:-}" || -z "${KAGGLE_KEY:-}" ]]; then
            echo "KAGGLE_API_TOKEN, or KAGGLE_USERNAME and KAGGLE_KEY, secrets are required for live smoke checks." >&2
            exit 1
          fi
          mkdir -p ~/.kaggle
          cat > ~/.kaggle/kaggle.json <<EOF
          {"username":"${KAGGLE_USERNAME}","key":"${KAGGLE_KEY}"}
          EOF
          chmod 600 ~/.kaggle/kaggle.json

      - name: Build datasets
        run: |
          set -euo pipefail
          python -m pip install numpy pandas
          bash manage.sh build-datasets

      - name: Run live smoke checks
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          args=(
            smoke-live
            --owner "${{ github.event.inputs.owner }}"
            --limit "${{ github.event.inputs.limit }}"
            --report-json "${REPORT_JSON}"
          )

          if [[ "${{ github.event.inputs.include_live_datasets }}" == "true" ]]; then
            args+=(--include-live-datasets)
          fi

          bash manage.sh "${args[@]}"

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: live-smoke-artifacts
          path: |
            /tmp/kaggle-live-smoke-dataset-publish.json
          if-no-files-found: ignore
