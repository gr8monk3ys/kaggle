name: security-baseline

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 22 * *"  # monthly (minute-safe policy)

permissions: read-all

concurrency:
  group: security-baseline
  cancel-in-progress: false

jobs:
  security-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Baseline CI check
        run: |
          echo "Security baseline workflow is active"
