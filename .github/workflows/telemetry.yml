name: Telemetry Snapshot

on:
  schedule:
    - cron: "30 9 * * 1"   # weekly (Mon), offset from medal-ops-health (Sat)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: telemetry
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI + deps (live mode only)
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${KAGGLE_USERNAME:-}" || -z "${KAGGLE_KEY:-}" ]]; then
            echo "No Kaggle credentials configured; telemetry needs live data. Exiting cleanly."
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          python -m pip install --upgrade pip
          python -m pip install "kaggle<2" requests

      - name: Configure Kaggle credentials (live mode only)
        if: env.SKIP != '1'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.kaggle
          printf '{"username":"%s","key":"%s"}' "${KAGGLE_USERNAME}" "${KAGGLE_KEY}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Sync tracker + record snapshot
        if: env.SKIP != '1'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          python -m kaggle_portfolio.ops.medal_ops sync
          python -m kaggle_portfolio.ops.medal_ops scorecard
          python -m kaggle_portfolio.notebooks.competition_scout --update || echo "scout refresh skipped"

      - name: Compose + send digest
        if: env.SKIP != '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          MSG="$(python -m kaggle_portfolio.ops.medal_ops digest || echo 'digest generation failed')"
          echo "$MSG"
          if [[ -n "${TELEGRAM_BOT_TOKEN:-}" ]]; then
            python pi-automation/scripts/notify.py "$MSG" || echo "notify failed (non-fatal)"
          else
            echo "No Telegram token; digest printed to log only."
          fi

      # main is a protected branch (PR required, enforced for admins), so the
      # snapshot goes up as a branch + PR rather than a direct push. The diff
      # is data-artifact-only, which the fleet merge gate can auto-merge.
      - name: Open telemetry PR
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reports/grandmaster-tracker.md medal_ops/history/ || true
          git add docs/reports/competition-scout-report.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No telemetry changes to commit."
            exit 0
          fi
          STAMP="$(date -u +%Y-%m-%d)"
          BRANCH="auto/telemetry-${STAMP}"
          git checkout -b "$BRANCH"
          git commit -m "chore(telemetry): snapshot ${STAMP} [skip ci]"
          git push --force-with-lease origin "$BRANCH"
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "PR already open for ${BRANCH}; branch updated."
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore(telemetry): snapshot ${STAMP}" \
              --body "Automated telemetry snapshot: tracker metrics, medal-ops history, and the competition scout report, refreshed from live Kaggle. Data artifacts only — no code changes."
          fi
